# Managed by Kaardid production deployment
# PREPARED TEMPLATE ONLY. Install/review separately at cutover; no public bind.
# Preserve this private probe listener when adding the agreed RA proxy backend.
log_format kaardid_production_safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
server {
    listen 127.0.0.1:18081;
    server_name kaardid.ra.ee;
    root /srv/kaardid-production/current/apps/kaardid;
    index index.php;
    server_tokens off;
    access_log /var/log/nginx/kaardid-production.access.log kaardid_production_safe;
    error_log /var/log/nginx/kaardid-production.error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Kaardid-Environment production always;
    location ^~ /protected/ { return 404; }
    location ^~ /ops/ { return 404; }
    location ^~ /bin/ { return 404; }
    location ^~ /docs/ { return 404; }
    location ~ (^|/)\. { return 404; }
    location ~* ^/(composer\.(json|lock)|package(-lock)?\.json|phpunit\.xml|playwright\.config\.js|README\.md|learnings\.md)$ { return 404; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ ^/index\.php(?:/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $path_info $fastcgi_path_info;
        # Before the first release, or after its failed activation, stay closed.
        if (!-f $document_root/index.php) { return 503; }
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/php8.5-fpm-kaardid-production.sock;
    }
    location ~* \.(php|phar|phtml)(?:/|$) { return 404; }
}
