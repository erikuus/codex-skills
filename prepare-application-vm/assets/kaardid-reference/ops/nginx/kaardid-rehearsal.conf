# Managed by Kaardid activate-rehearsal
# Keep these entries aligned with protected/components/IpBlockFilter.php.
geo $kaardid_rehearsal_bot_rule {
    default 0;
    152.53.35.171 152.53.35.171;
    149.200.255.50 149.200.255.50;
    116.96.77.194 116.96.77.194;
    194.246.91.37 194.246.91.37;
    173.252.87.37 173.252.87.37;
    57.141.0.0/24 57.141.0.0/24;
    57.141.20.0/24 57.141.20.0/24;
    66.249.66.0/24 66.249.66.0/24;
}
log_format kaardid_rehearsal_safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time '
                                 'upstream=$upstream_status bot_rule=$kaardid_rehearsal_bot_denial';
server {
    listen 127.0.0.1:18080;
    server_name localhost 127.0.0.1;
    root /srv/kaardid/rehearsal/apps/kaardid;
    index index.php;
    server_tokens off;
    set $kaardid_rehearsal_bot_denial -;
    access_log /var/log/nginx/kaardid-rehearsal.access.log kaardid_rehearsal_safe;
    error_log /var/log/nginx/kaardid-rehearsal.error.log warn;
    add_header X-Content-Type-Options nosniff always;
    location ^~ /protected/ { return 404; }
    location ^~ /ops/ { return 404; }
    location ^~ /bin/ { return 404; }
    location ^~ /docs/ { return 404; }
    location ~ (^|/)\. { return 404; }
    location ~* ^/(composer\.(json|lock)|package(-lock)?\.json|phpunit\.xml|playwright\.config\.js|README\.md|learnings\.md)$ { return 404; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ ^/index\.php(?:/|$) {
        # A local response keeps the full request out of the access-module error log.
        if ($kaardid_rehearsal_bot_rule) {
            set $kaardid_rehearsal_bot_denial $kaardid_rehearsal_bot_rule;
            return 403;
        }
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $path_info $fastcgi_path_info;
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/php8.5-fpm-kaardid.sock;
    }
    location ~* \.(php|phar|phtml)(?:/|$) { return 404; }
}
