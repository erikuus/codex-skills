# Staging endpoint for the RA reverse proxy. The production app stays closed
# while the VM still holds preview data and the proxy's client-IP policy is pending.
server {
    listen 172.20.20.142:80;
    server_name kaardid.arhiiv.ee;
    return 308 https://kaardid.arhiiv.ee$request_uri;
}
server {
    listen 172.20.20.142:443 ssl;
    server_name kaardid.arhiiv.ee kaardid.ra.ee;
    ssl_certificate /etc/ssl/certs/kaardid.arhiiv.ee.crt;
    ssl_certificate_key /etc/ssl/private/kaardid.arhiiv.ee.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header X-Kaardid-Environment production-backend-staging always;
    return 503;
}
