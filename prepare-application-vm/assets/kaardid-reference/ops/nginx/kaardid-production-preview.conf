# Managed by Kaardid production-preview; remove at real production cutover.
log_format kaardid_preview_safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
server {
    listen 172.20.20.142:80 default_server;
    server_name _;
    return 404;
}
server {
    listen 172.20.20.142:80;
    listen 127.0.0.1:18082;
    server_name kaardid.arhiiv.ee;
    root /srv/kaardid-production/preview/apps/kaardid;
    index index.php;
    server_tokens off;
    access_log /var/log/nginx/kaardid-production-preview.access.log kaardid_preview_safe;
    error_log /var/log/nginx/kaardid-production-preview.error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Kaardid-Environment production-preview always;
    add_header X-Kaardid-Data rehearsal-copy always;
    # Network ACL comes from the existing private interface/VPN route. Never
    # trust caller-supplied forwarded headers as a client identity here.
    sub_filter '<body>' '<body><div style="background:#fff1b8;color:#222;padding:12px;text-align:center">VPN preview — rehearsal test data. Changes will be replaced at production cutover.</div>';
    sub_filter_once on;
    location ^~ /protected/ { return 404; }
    location ^~ /ops/ { return 404; }
    location ^~ /bin/ { return 404; }
    location ^~ /docs/ { return 404; }
    location ~ (^|/)\. { return 404; }
    location ~* ^/(composer\.(json|lock)|package(-lock)?\.json|phpunit\.xml|playwright\.config\.js|README\.md|learnings\.md)$ { return 404; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ ^/index\.php(?:/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $path_info $fastcgi_path_info;
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_param HTTP_X_REAL_IP "";
        fastcgi_param HTTP_ACCEPT_ENCODING "";
        fastcgi_pass unix:/run/php/php8.5-fpm-kaardid-production.sock;
    }
    location ~* \.(php|phar|phtml)(?:/|$) { return 404; }
}
