<!-- StepProgress: load patterns.css. One ordered list, one step model, no duplicated accessible navigation.
     All complete steps precede the current step; pending steps follow. -->
<nav aria-label="Töövoo edenemine"><ol class="ra-steps">
<li class="ra-step ra-step--complete"><span class="ra-step-marker" aria-hidden="true"><span class="ra-step-number">1</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg></span><span class="ra-step-label">Vali<span class="sr-only"> (lõpetatud)</span></span></li>
<li class="ra-step ra-step--complete"><span class="ra-step-marker" aria-hidden="true"><span class="ra-step-number">2</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg></span><span class="ra-step-label">Täida<span class="sr-only"> (lõpetatud)</span></span></li>
<li class="ra-step ra-step--current" aria-current="step"><span class="ra-step-marker" aria-hidden="true"><span class="ra-step-number">3</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg></span><span class="ra-step-label">Lisa failid<span class="sr-only"> (praegune samm)</span></span></li>
<li class="ra-step ra-step--pending"><span class="ra-step-marker" aria-hidden="true"><span class="ra-step-number">4</span></span><span class="ra-step-label">Kinnita<span class="sr-only"></span></span></li>
<li class="ra-step ra-step--pending"><span class="ra-step-marker" aria-hidden="true"><span class="ra-step-number">5</span></span><span class="ra-step-label">Valmis<span class="sr-only"></span></span></li>
</ol></nav>
