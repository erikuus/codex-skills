<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="referrer" content="no-referrer">
<title>{{TITLE}} · Kohaajaloo raport</title>
<style>
:root{--ink:#263c34;--body:#303a35;--muted:#66736b;--paper:#fff;--wash:#f6f7f2;--line:#dde3da;--green:#285b46;--soft:#eaf1eb;--amber:#79521c;--amberbg:#fbf4e6;--blue:#315f82}
*{box-sizing:border-box}html{scroll-behavior:auto;scroll-padding-top:2rem}body{margin:0;background:var(--wash);color:var(--body);font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}a{color:var(--green);text-underline-offset:.2em;overflow-wrap:anywhere}a:hover{color:#143e2c}a:focus-visible,button:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid #a46c20;outline-offset:4px}.skip{position:absolute;left:1rem;top:-5rem;background:#fff;padding:.8rem;z-index:5}.skip:focus{top:1rem}.masthead{max-width:1200px;margin:auto;padding:24px 32px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:15px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;color:var(--green)}.masthead small{color:var(--muted)}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);max-width:1200px;margin:auto;align-items:start}.sidebar{position:sticky;top:0;padding:32px 24px 28px 32px;max-height:100vh;overflow-y:auto}.sidebar summary{font-size:11px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);cursor:pointer;margin-bottom:16px}.toc{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}.toc li{margin:0}.toc a{display:block;text-decoration:none;color:#526158;font-size:13px;line-height:1.45;padding:7px 10px;border-left:2px solid transparent;margin-left:-1px}.toc a:hover,.toc a[aria-current]{background:var(--soft);color:var(--green);border-color:var(--green)}button{font:inherit;cursor:pointer;border:1px solid var(--green);border-radius:5px;background:var(--green);color:#fff;padding:9px 16px}.print{width:100%;margin-top:22px;font-size:13px}.sidebar-note{font-size:12px;line-height:1.55;color:var(--muted)}main{min-width:0;background:var(--paper);border-left:1px solid var(--line);border-right:1px solid var(--line);padding:48px 52px 64px}.eyebrow{font-size:11px;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin:0 0 14px}.hero h1{font-size:clamp(30px,3.2vw,43px);font-weight:650;letter-spacing:-.035em;line-height:1.18;color:var(--ink);margin:0 0 15px;overflow-wrap:anywhere}.subtitle{font-size:18px;line-height:1.5;color:var(--muted);margin:0 0 20px}.meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));margin:28px 0 0;border:1px solid var(--line);border-radius:6px;background:var(--wash)}.fact{padding:16px 18px;min-width:0}.fact dt{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.fact dd{margin:5px 0 0;color:var(--ink);font-size:18px;font-weight:600;line-height:1.4}.fact small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:4px}.report-section{padding-top:30px;margin-top:32px;border-top:1px solid var(--line);scroll-margin-top:24px}.report-section h2{margin:0 0 22px;font-size:24px;line-height:1.3;letter-spacing:-.02em;color:var(--ink)}h3{font-size:17px;line-height:1.4;margin:0 0 10px;color:var(--ink)}p{margin:0 0 17px;overflow-wrap:anywhere}li{margin-bottom:10px}ul,ol{padding-left:23px}.refs{display:inline;font-size:12px;line-height:1.5;color:var(--muted);margin-left:.35em}.refs a{white-space:normal}.badge{font-size:10px;font-weight:650;display:inline-block;padding:1px 7px;border:1px solid var(--line);border-radius:99px;letter-spacing:.02em;color:var(--muted);vertical-align:middle;margin-right:7px}.badge.otsene{background:var(--soft);color:var(--green);border-color:#c7d9ca}.badge.jareldus{background:#edf3f7;color:var(--blue);border-color:#ccdae5}.badge.oletus,.badge.ebakindel{background:var(--amberbg);color:var(--amber);border-color:#e2d1ab}.notice{padding:18px 22px;border-left:3px solid var(--green);background:var(--soft);margin:20px 0;border-radius:0 5px 5px 0}.notice.warning{background:var(--amberbg);border-color:#a77934}.notice p:last-child{margin:0}.table-scroll{overflow-x:auto;margin:20px 0}.table-scroll table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.6;table-layout:auto}.table-scroll caption{text-align:left;font-weight:600;margin-bottom:10px}th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--wash)}th,td{padding:12px 13px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}td:first-child{font-weight:550}td .refs{display:block;margin:5px 0 0}.timeline{list-style:none;padding:0;margin:20px 0}.event{display:grid;grid-template-columns:105px minmax(0,1fr);gap:22px;margin:0;position:relative;padding-bottom:14px}.event:before{content:"";position:absolute;left:115px;top:12px;bottom:-12px;width:1px;background:var(--line)}.event:last-child:before{bottom:20px}.event:after{content:"";width:7px;height:7px;border:3px solid white;border-radius:50%;background:var(--green);box-sizing:content-box;position:absolute;left:109px;top:10px}.event time{font-size:13px;font-weight:650;text-align:right;line-height:1.4;padding-top:10px}.event-content{border:1px solid var(--line);border-radius:7px;padding:14px 17px;background:var(--wash)}.event-content p{margin:6px 0 4px;font-size:14px}.event-content .refs{display:block;margin:5px 0 0}.event-kind{font-size:10px;letter-spacing:.09em;color:var(--green);font-weight:650;text-transform:uppercase}figure{margin:24px 0}figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:var(--wash);border:1px solid var(--line);border-radius:5px}figcaption{font-size:12px;line-height:1.6;color:var(--muted);padding-top:10px}figcaption strong{color:var(--body)}.image-placeholder{min-height:225px;display:grid;place-content:center;text-align:center;gap:8px;background:repeating-linear-gradient(0deg,transparent,transparent 29px,#e7e8df 30px),repeating-linear-gradient(90deg,#f6f5ec,#f6f5ec 29px,#e7e8df 30px);border:1px solid var(--line);border-radius:5px;padding:25px;color:#687264}.image-placeholder span{font-size:12px}.document{border:1px solid var(--line);padding:22px;margin:24px 0;border-radius:6px}.document-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}.transcription{font:16px/1.85 Georgia,"Times New Roman",serif;white-space:pre-wrap;border-left:2px solid #cbd6c5;padding:10px 18px;margin:0 0 20px;background:var(--wash);overflow-wrap:anywhere}.source-list{list-style:none;padding:0;counter-reset:sources}.source-list>li{padding:16px 0;border-bottom:1px solid var(--line);font-size:13px;scroll-margin-top:24px}.source-id{font-size:11px;font-weight:700;color:var(--green);margin-right:7px}.source-detail,.source-url{display:block;font-size:12px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}.source-url{font-size:11px}.footer{border-top:1px solid var(--line);padding-top:22px;margin-top:38px;font-size:12px;color:var(--muted)}.demo{font-size:13px}.print-hint{font-size:11px;color:var(--muted)}
@media(max-width:850px){.masthead{padding:18px 22px}.layout{display:block}.sidebar{position:static;padding:18px 22px;max-height:none}.sidebar details:not([open]){margin:0}.sidebar summary{margin-bottom:0}.toc{columns:2;margin-top:16px}.toc li{break-inside:avoid}.print{width:auto;margin:15px 0 0}.sidebar-note{display:none}main{padding:30px 25px 45px;border:none}.hero h1{font-size:34px}.masthead small{display:none}.report-section{margin-top:25px;padding-top:25px}}
@media(max-width:480px){body{font-size:15px}.toc{columns:1}main{padding:28px 20px 40px}.hero h1{font-size:31px}.facts{grid-template-columns:1fr 1fr}.event{grid-template-columns:1fr;gap:6px;padding-left:19px;padding-bottom:20px}.event time{text-align:left;padding:0}.event:before{left:3px;top:6px;bottom:-4px}.event:after{left:-3px;top:2px}.event-content{padding:12px}.report-section h2{font-size:22px}.document{padding:15px}th,td{padding:10px 8px}.notice{padding:16px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@page{size:A4;margin:17mm 17mm 19mm}
@media print{html{scroll-behavior:auto}body{background:#fff;font-size:10.5pt;line-height:1.55;color:#222}.skip,.sidebar,.print-hint{display:none!important}.masthead{padding:0 0 10mm;max-width:none}.masthead small{display:block}.layout{display:block;max-width:none}main{border:0;padding:0}.hero h1{font-size:28pt}.subtitle{font-size:13pt}.facts{grid-template-columns:repeat(3,1fr)}.fact{padding:10px}.fact dd{font-size:12pt}.report-section{margin-top:7mm;padding-top:6mm}.report-section h2{font-size:16pt;break-after:avoid}h3,.document-label{break-after:avoid}p{orphans:3;widows:3}.notice,.event,figure,.fact{break-inside:avoid}.timeline .event{display:grid;grid-template-columns:95px 1fr;padding-left:0;gap:20px}.event time{text-align:right}.event:before{left:104px}.event:after{left:98px}.event-content{padding:10px}.table-scroll{overflow:visible}table{font-size:9pt!important;table-layout:fixed!important}thead{display:table-header-group}tr{break-inside:avoid}th,td{padding:7px}.document{padding:12px}.transcription{font-size:11pt}figure img{max-height:160mm}a{color:#244b3a;text-decoration:none}.source-list>li{break-inside:avoid}.source-url{color:#444}.footer{font-size:9pt}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<a class="skip" href="#report">Liigu raporti juurde</a>
<header class="masthead"><div class="brand">Kohaajalugu</div><small>Arhiivid · kaardid · inimesed</small></header>
<div class="layout">
<aside class="sidebar"><details id="contents" open><summary>Sisukord</summary><nav aria-label="Raporti sisukord"><ol class="toc">{{TOC}}</ol></nav></details><button class="print" type="button" onclick="window.print()">Prindi / salvesta PDF</button><p class="sidebar-note">Viitenumber avab allikakirje raporti lõpus. Oletused ja ebakindlad lugemid on tekstis märgitud.</p></aside>
<main id="report" tabindex="-1">
<header class="hero"><p class="eyebrow">Kohaajaloo raport</p><h1>{{TITLE}}</h1>{{SUBTITLE}}<div class="meta">{{META}}</div>{{NOTICE}}{{FACTS}}</header>
{{SECTIONS}}
<footer class="footer">{{FOOTER}}</footer>
</main></div>
<script>
// The report itself is static HTML; navigation and printing work without a framework.
if(window.matchMedia('(max-width:850px)').matches)document.getElementById('contents').open=false;
const links=[...document.querySelectorAll('.toc a')];
function markSection(){const hash=window.location.hash;for(const link of links){if(link.hash===hash)link.setAttribute('aria-current','location');else link.removeAttribute('aria-current');}}
window.addEventListener('hashchange',markSection);markSection();
</script>
</body>
</html>
